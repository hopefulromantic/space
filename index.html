<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>safi's  space</title>
    <link href="https://fonts.googleapis.com/css2?family=Meddon&family=DM+Sans:wght@400;500;700&family=Syne:wght@700&family=Yeseva+One&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #105666; --rose: #fbceb7; --text: #ecf2d8; --border: rgba(236, 242, 216, 0.3); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'DM Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 60px; text-align: center; }
        
        /* Hero */
        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .sub-heading { font-family: 'Meddon', cursive; font-size: 44px; margin-bottom: 2px; }
        h1 { font-family: 'Yeseva One', serif; font-size: 74px; color: var(--rose); margin-bottom: 40px; text-transform: lowercase; white-space: pre-wrap; letter-spacing: 1px; }
        .nav { display: flex; gap: 50px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 16px 48px; }
        .nav a, .nav span { font-family: 'Syne', sans-serif; font-size: 14px; font-weight: 700; color: var(--text); text-decoration: none; letter-spacing: 3px; cursor: pointer; }

        /* Calendar */
        .calendar-section { max-width: 1100px; margin: 0 auto; padding: 60px 40px; border: 1px solid var(--border); }
        h2 { font-family: 'Syne', sans-serif; font-size: 32px; margin-bottom: 30px; letter-spacing: 4px; }
        .legend { font-size: 13px; margin-bottom: 40px; opacity: 0.9; }
        .months { display: flex; justify-content: center; gap: 30px; margin-bottom: 40px; }
        .month { background: rgba(255, 255, 255, 0.05); padding: 24px; border: 1px solid #FAFAFA; flex: 1; max-width: 320px; }
        .side-month { opacity: 0.25; pointer-events: none; }
        .current-month { background: rgba(255, 255, 255, 0.1); border-color: var(--rose); }
        .month-header { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 20px; text-transform: uppercase; }
        .current-month .month-header { color: var(--rose); }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
        .day-name { font-weight: 700; font-size: 11px; color: #A09592; margin-bottom: 8px; }
        .day { aspect-ratio: 1; display: flex; justify-content: center; align-items: center; font-size: 13px; position: relative; cursor: pointer; background: transparent; border: none; color: var(--text); width: 100%; }
        .today { background: var(--text) !important; color: #105666 !important; font-weight: 700; border-radius: 4px; }
        .routine::after { content: ''; position: absolute; width: 32px; height: 32px; border: 1px solid var(--rose); border-radius: 50%; }
        .has-memo::before { content: ''; position: absolute; bottom: 2px; width: 4px; height: 4px; background: var(--rose); border-radius: 50%; }

        /* Memos */
        .memos { border-top: 1px solid var(--border); padding-top: 40px; text-align: left; }
        .memos h3 { font-family: 'Syne', sans-serif; font-size: 14px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        .inputs { display: flex; gap: 12px; margin-bottom: 25px; }
        .inputs input { background: var(--bg); border: 1px solid var(--border); padding: 12px; color: var(--text); font-size: 14px; outline: none; }
        .inputs input[type="text"] { flex: 1; }
        .inputs input::placeholder { color: #bcccab; opacity: 0.5; }
        .inputs button { background: var(--text); color: #105666; border: none; padding: 0 24px; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; }
        .item { display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .item b { font-family: 'Syne', sans-serif; color: var(--rose); margin-right: 10px; }
        .del { background: transparent; border: none; color: #C0B5B2; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>

    <div class="hero">
        <div class="sub-heading">S+</div>
        <h1>safi's  space</h1>
        <div class="nav">
            <a href="https://hopefulromantic.github.io/countdown/" target="_blank">COUNTDOWN</a>
            <span onclick="document.getElementById('cal').scrollIntoView({behavior:'smooth'})">CALENDAR</span>
            <a href="https://strossy.my.canva.site/" target="_blank">STROSSY</a>
        </div>
    </div>

    <div class="calendar-section" id="cal">
        <h2>CALENDAR</h2>
        <div class="legend">Centering ring profiles outline your Azelaic Acid / Adapalene cycle nights.</div>

        <div class="months">
            <div class="month side-month"><div class="month-header">June 2026</div><div class="grid" id="m1"></div></div>
            <div class="month current-month"><div class="month-header">July 2026</div><div class="grid" id="m2"></div></div>
            <div class="month side-month"><div class="month-header">August 2026</div><div class="grid" id="m3"></div></div>
        </div>

        <div class="memos">
            <h3>Reminders & Notes</h3>
            <div class="inputs">
                <input type="date" id="date">
                <input type="text" id="text" placeholder="Add entry notes to schedule...">
                <button onclick="addMemo()">Save</button>
            </div>
            <div id="list"></div>
        </div>
    </div>

    <script>
        const routineStart = new Date(2026, 6, 7), today = new Date();
        let memos = JSON.parse(localStorage.getItem("memos")) || [{ date: "2026-07-08", text: "Studio setup customized successfully." }];

        function build(id, year, month) {
            const grid = document.getElementById(id); grid.innerHTML = '';
            ['S','M','T','W','T','F','S'].forEach(d => grid.innerHTML += `<div class="day-name">${d}</div>`);
            
            let start = new Date(year, month, 1).getDay(), total = new Date(year, month + 1, 0).getDate();
            for(let i=0; i<start; i++) grid.appendChild(document.createElement('div'));

            for(let d=1; d<=total; d++) {
                let cell = document.createElement('button'), fDate = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                cell.className = 'day'; cell.innerText = d;
                
                if(year === today.getFullYear() && month === today.getMonth() && d === today.getDate()) cell.classList.add('today');
                if(Math.floor((new Date(year, month, d) - routineStart)/(1000*60*60*24)) % 3 === 0) cell.classList.add('routine');
                if(memos.some(m => m.date === fDate)) cell.classList.add('has-memo');

                cell.onclick = () => { document.getElementById('date').value = fDate; document.getElementById('text').focus(); };
                grid.appendChild(cell);
            }
        }

        function render() {
            localStorage.setItem("memos", JSON.stringify(memos));
            const container = document.getElementById('list'); container.innerHTML = '';
            memos.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach((m, i) => {
                container.innerHTML += `<div class="item"><span><b>${m.date}</b> ${m.text}</span><button class="del" onclick="del(${i})">×</button></div>`;
            });
            build('m1', 2026, 5); build('m2', 2026, 6); build('m3', 2026, 7);
        }

        function addMemo() {
            let d = document.getElementById('date').value, t = document.getElementById('text').value.trim();
            if(d && t) { memos.push({ date: d, text: t }); document.getElementById('text').value = ''; render(); }
        }
        function del(i) { memos.splice(i, 1); render(); }

        document.getElementById('date').value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
        render();
    </script>
</body>
</html>
